book:
  id: four_seasons
  title: "Four Seasons"
  subtitle: "An Adult Coloring Collection"
  author: "MBOQ Colors"
  trim_size: "8.5x11"
  orientation: portrait
  target_pages: 40
  bleed: false
  audience: "Adult"
  theme: "4 Seasons"

style:
  style_reference: null  # set after picking early favorites (PRD 12.1/12.2)
  style_weight: 150
  medium: "adult coloring book line art"
  line_style: "bold uniform-width black outlines, every shape fully closed with no open or dangling line ends, no hatching or texture linework"
  background: "pure white background, no texture or noise"
  complexity: "high"
  midjourney_stylize: 50
  midjourney_style_raw: true
  style_anchor: "stained glass window"  # fixed for the whole book (model: Gemini) - cohesion, not per-page rotation
  border_style: "a solid black border with square corners"  # fixed for the whole book, same reasoning

base_elements:
  - flower
  - vine
  - raindrop
  - bud
  - wave
  - shell
  - sunburst
  - leaf
  - acorn
  - pinecone
  - wheat
  - snowflake
  - icicle
  - frost
  - crystal
  - spiral

compositions:
  - organic_all_over
  - interlocking
  - flowing_diagonal
  - branching
  - nested
  - alternating_bands
  - overlapping
  - asymmetric_repeating
  - geometric_lattice
  - clustered

constraints:
  - no text
  - no numbers
  - no people
  - no shading
  - no gray
  - no color
  - no gradients
  - no solid black areas
  - no traditional mandala
  - no single central object
  - no concentric rings
  - no generic clip art

production:
  dpi: 300
  border: true
  target_width_inches: 8.5
  target_height_inches: 11.0
  threshold: true
  threshold_value: 200
  margin_inches: 1.0
  recto_only: true

ordering:
  avoid_adjacent_same_element: true
  avoid_adjacent_same_composition: true
  target_density_variation: true

diversity:
  max_same_element_consecutive: 1
  max_same_composition_consecutive: 1
  max_same_element_count: 4
  max_same_composition_count: 6
  max_duplicate_combination_count: 1
  candidates_per_page: 3
  duplicate_phash_threshold: 10

front_matter:
  pages:
    - title_page
    - copyright_page
    - belongs_to_page

back_matter:
  pages: []

cover_text:
  enabled: true
  front_subtitle: "Adult Coloring Book"
  back_description: |
    Step into a year of color with "Four Seasons", a collection of 40 original stained-glass-inspired coloring pages celebrating spring, summer, autumn, and winter.

    Each design is built from the small, familiar details of the changing year - flowers and vines unfurling in spring, waves and sunbursts of summer, acorns, pine cones, and drifting leaves in autumn, and snowflakes, frost, and icicles in the quiet of winter. Bold black outlines and richly patterned, stained-glass-style line work turn every page into an intricate mosaic of interlocking shapes, flowing bands, and layered motifs - never a repeat, and never a page that feels like a template.

    Every design is abstract and ornamental rather than realistic, so there's no "right" way to color it and no pressure to get it perfect. That makes this book a calm, meditative escape as much as a creative one - pick up a pencil or marker and lose yourself in a pattern for a few minutes or a few hours.

    What's inside:
    - 40 original, single-sided designs - nothing lost to bleed-through
    - Printed on one side of each 8.5" x 11" page for clean removal and display
    - High-contrast black-and-white line art, ready for markers, gel pens, or colored pencils
    - A dedicated "This book belongs to" page - makes a thoughtful gift
    - No two designs alike - every page is a fresh pattern to discover

    Whether you're unwinding after a long day or looking for a relaxing gift for a fellow colorist, "Four Seasons" offers a full year of intricate, anxiety-free coloring, one season at a time!
