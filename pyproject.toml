[project]
name = "bookfactory"
version = "0.1.0"
description = "Local production pipeline for generative adult coloring books, from book.yaml to a KDP-ready interior PDF."
authors = [
    { name = "Jeff Peterson", email = "jeff@tienta.net" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pillow>=10.3",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "imagehash>=4.3",
    "reportlab>=4.2",
    "pymupdf>=1.24",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
bookfactory = "cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "cli"]
